<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador SADE — Relato 190 Essencial (Teste)</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1a2533;color:#d0dae5;font-family:system-ui,Arial,sans-serif}
.topbar{background:#0d1a26;border-bottom:1px solid #2a3d4f;padding:10px 18px;display:flex;align-items:center;gap:12px}
.topbar img{width:28px;height:28px;border-radius:6px;background:#1e3048}
.topbar span{font-weight:700;font-size:14px;color:#9bc4d8}
.topbar small{font-size:11px;color:#5a7a8e;margin-left:auto}
.menu{background:#152030;border-bottom:1px solid #253545;display:flex;gap:2px;padding:4px 8px}
.menu button{background:transparent;border:0;color:#8aaabb;padding:6px 12px;font-size:12px;border-radius:5px;cursor:pointer}
.menu button:hover,.menu button.active{background:#1e3548;color:#cce4f0}
.container{display:flex;height:calc(100vh - 82px)}
.sidebar{width:220px;flex-shrink:0;background:#10202e;border-right:1px solid #1e3040;padding:12px 8px;font-size:12px;color:#7a9aaa}
.sidebar div{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px}
.sidebar div:hover{background:#1a2e3f;color:#b0cdd8}
.sidebar div.active{background:#1a3548;color:#8ecfe2;font-weight:700}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
/* iframe principal do SADE */
#iframeContainer{width:100%;flex:1;border:none}
/* Painel de teste */
.test-panel{background:#112030;border-top:1px solid #253545;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:11px;color:#7a9aaa}
.test-panel button{background:#1a4060;border:1px solid #2a6080;color:#8dd4f0;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:11px}
.test-panel button:hover{background:#1e5070}
#simStatus{flex:1;color:#5a9aaa}
</style>
</head>
<body>

<!-- Barra superior simulada do SADE -->
<div class="topbar">
  <div style="width:28px;height:28px;border-radius:6px;background:#1e4060;display:grid;place-items:center;font-size:16px">🛡</div>
  <span>SADE — Sistema de Atendimento de Demandas</span>
  <small>⚠ SIMULADOR DE TESTE — Não é o sistema real. Dados fictícios apenas.</small>
</div>

<!-- Menu simulado -->
<div class="menu">
  <button class="active">Atendimento</button>
  <button>Acompanhamento</button>
  <button>Relatórios</button>
  <button>Administração</button>
</div>

<!-- Container principal: sidebar + iframe -->
<div class="container">
  <div class="sidebar">
    <div class="active">📋 Nova Ocorrência</div>
    <div>🔍 Buscar Ocorrências</div>
    <div>📊 Dashboard</div>
    <div>⚙ Configurações</div>
  </div>
  <div class="main">
    <!-- IFRAME PRINCIPAL — este é o #iframeContainer identificado no SADE real -->
    <iframe id="iframeContainer" name="container" src="about:blank" title="Área de atendimento SADE"></iframe>

    <!-- Controles de simulação -->
    <div class="test-panel">
      <button onclick="loadForm()">▶ Carregar formulário</button>
      <button onclick="simulateCityTyping()">📍 Testar Município ("Holombo")</button>
      <button onclick="simulateStreetTyping()">🛣 Testar Rua ("Rua Ataufo Alvis")</button>
      <button onclick="toggleTheme()">🌓 Alternar Tema (Dark/Light)</button>
      <button onclick="clearForm()">🗑 Limpar</button>
      <span id="simStatus">Simulador SADE — formulário não carregado.</span>
    </div>
  </div>
</div>

<script>
// ─── Conteúdo do formulário simulado interno ──────────────────────────────
// Simula o HTML interno que estaria em /syspm-web/public/atendimento/saveLegado
// Os IDs e labels usados aqui são FICTÍCIOS para fins de teste.
// Os IDs reais do SADE precisam ser inspecionados em ambiente autorizado.
const FORM_HTML = `<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f5f8fa;color:#1a2d38;font-family:system-ui,Arial,sans-serif;font-size:13px}
h2{font-size:15px;margin:0 0 16px;color:#0d3049;border-bottom:1px solid #c5d8e3;padding-bottom:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.form-row{display:flex;flex-direction:column}
.form-row.full{grid-column:1/-1}
label{font-size:11px;font-weight:700;color:#355060;margin-bottom:4px;display:block}
input[type=text],input[type=tel],textarea,select{width:100%;padding:8px 10px;border:1px solid #b8ccda;border-radius:6px;font:13px system-ui,Arial,sans-serif;color:#1a3040;background:#fff}
input[type=text]:focus,input[type=tel]:focus,textarea:focus{outline:2px solid #2a7aa8;border-color:#2a7aa8}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.section-title{grid-column:1/-1;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#1a5070;margin:8px 0 4px;border-top:1px solid #dce8ee;padding-top:10px}
.btn-area{grid-column:1/-1;display:flex;gap:10px;margin-top:8px}
.btn-primary{background:#0a6090;color:white;border:0;border-radius:7px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer}
.btn-secondary{background:#e0eaf0;color:#2a5060;border:1px solid #b0c8d8;border-radius:7px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer}
.notice{grid-column:1/-1;background:#fffbe6;border:1px solid #e6d8a0;border-radius:6px;padding:8px 10px;font-size:10px;color:#6a5020}
</style>
</head>
<body>
<h2>Geração de Ocorrência — Atendimento</h2>
<form id="formAtendimento" onsubmit="return false">
<div class="form-grid">
  <div class="notice">⚠ SIMULADOR — Dados fictícios para teste. Nenhuma ocorrência real é gerada. Os IDs e labels são exemplos; os campos reais do SADE precisam ser inspecionados em ambiente autorizado.</div>

  <div class="section-title">Dados do Solicitante</div>

  <div class="form-row">
    <label for="nomeSolicitante">Nome do Solicitante</label>
    <input type="text" id="nomeSolicitante" name="nomeSolicitante" placeholder="Nome completo do solicitante" value="Maria Fictícia da Silva">
  </div>

  <div class="form-row">
    <label for="telefoneSolicitante">Telefone</label>
    <input type="tel" id="telefoneSolicitante" name="telefoneSolicitante" placeholder="(41) 99999-0000" value="41987650000">
  </div>

  <div class="section-title">Local da Ocorrência</div>

  <div class="form-row">
    <label for="municipioOcorrencia">Município</label>
    <input type="text" id="municipioOcorrencia" name="municipioOcorrencia" placeholder="Município" value="Colombo">
  </div>

  <div class="form-row">
    <label for="cepOcorrencia">CEP</label>
    <input type="text" id="cepOcorrencia" name="cepOcorrencia" placeholder="00000-000" maxlength="9">
  </div>

  <div class="form-row full">
    <label for="logradouroOcorrencia">Logradouro / Rua</label>
    <input type="text" id="logradouroOcorrencia" name="logradouroOcorrencia" placeholder="Rua, avenida ou travessa" value="Rua Fictícia do Bosque">
  </div>

  <div class="form-row">
    <label for="numeroImovel">Número</label>
    <input type="text" id="numeroImovel" name="numeroImovel" placeholder="Nº" value="69">
  </div>

  <div class="form-row">
    <label for="bairroOcorrencia">Bairro</label>
    <input type="text" id="bairroOcorrencia" name="bairroOcorrencia" placeholder="Bairro" value="Bairro Demonstrativo">
  </div>

  <div class="form-row full">
    <label for="complementoOcorrencia">Complemento</label>
    <input type="text" id="complementoOcorrencia" name="complementoOcorrencia" placeholder="Complemento (apto., bloco, referência)">
  </div>

  <div class="section-title">Texto da Ocorrência</div>

  <div class="form-row full">
    <label for="relatoOcorrencia">Relato da Ocorrência</label>
    <textarea id="relatoOcorrencia" name="relatoOcorrencia" placeholder="Descreva a ocorrência detalhadamente..."></textarea>
  </div>

  <div class="btn-area">
    <button class="btn-primary" type="button" onclick="simulateSave()">Gerar Ocorrência (simulação)</button>
    <button class="btn-secondary" type="button" onclick="clearFields()">Limpar</button>
  </div>
</div>
</form>

<script>
function simulateSave(){
  alert('SIMULAÇÃO: Formulário enviado. Em produção, este botão enviaria a ocorrência ao SADE. Nenhum dado foi transmitido.');
  clearFields();
}
function clearFields(){
  const form=document.getElementById('formAtendimento');
  for(const el of form.querySelectorAll('input,textarea'))el.value='';
  document.querySelectorAll('input,textarea').forEach(el=>el.dispatchEvent(new Event('input',{bubbles:true})));
}
<\/script>
</body>
</html>`;

// ─── Formulário com nomes similares (teste de conflito) ───────────────────
const FORM_AMBIGUOUS_HTML = FORM_HTML.replace(
  'id="relatoOcorrencia"',
  'id="relatoOcorrencia"'
).replace(
  'id="nomeSolicitante"',
  'id="nomeAtendente"'
).replace(
  'Nome do Solicitante',
  'Nome do Atendente'
).replace(
  '<!-- campo extra ambíguo -->', ''
);

let formLoaded = false;

function loadForm() {
  const iframe = document.getElementById('iframeContainer');
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(FORM_HTML);
  doc.close();
  formLoaded = true;
  document.getElementById('simStatus').textContent =
    'Formulário de atendimento carregado. Verifique o adaptador SADE na extensão.';
}

function loadEmpty() {
  const iframe = document.getElementById('iframeContainer');
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write('<html><body style="background:#f5f8fa;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#7a9aaa;font-size:13px"><div>Aguardando seleção de atendimento…</div></body></html>');
  doc.close();
  formLoaded = false;
  document.getElementById('simStatus').textContent =
    'Tela de acompanhamento (sem formulário). O adaptador deve mostrar "Aguardando formulário".';
}

function reloadForm() {
  if (!formLoaded) { loadForm(); return; }
  const iframe = document.getElementById('iframeContainer');
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  // Simula reload dinâmico (jQuery/AJAX): substitui apenas o conteúdo do form
  const newForm = doc.getElementById('formAtendimento');
  if (newForm) {
    // Recriar campos — testa o MutationObserver do adaptador
    const clone = newForm.cloneNode(true);
    newForm.replaceWith(clone);
    document.getElementById('simStatus').textContent =
      'Formulário recriado dinamicamente. O adaptador SADE deve redetectar os campos.';
  } else {
    loadForm();
  }
}

function clearForm() {
  const iframe = document.getElementById('iframeContainer');
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  if (!doc) return;
  doc.querySelectorAll('input,textarea').forEach(el => {
    el.value = '';
    el.dispatchEvent(new Event('input', {bubbles: true}));
  });
  document.getElementById('simStatus').textContent =
    'Campos limpos. Simula conclusão de uma ocorrência.';
}

function simulateCityTyping() {
  if (!formLoaded) loadForm();
  setTimeout(() => {
    const iframe = document.getElementById('iframeContainer');
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    const input = doc.getElementById('municipioOcorrencia');
    if (input) {
      input.value = 'Holombo';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.focus();
      document.getElementById('simStatus').textContent =
        'Digitado "Holombo". O popup flutuante deve surgir na tela indicando "Colombo" com [Usar]!';
    }
  }, 300);
}

function simulateStreetTyping() {
  if (!formLoaded) loadForm();
  setTimeout(() => {
    const iframe = document.getElementById('iframeContainer');
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    const input = doc.getElementById('logradouroOcorrencia');
    if (input) {
      input.value = 'Rua Ataufo Alvis';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.focus();
      document.getElementById('simStatus').textContent =
        'Digitado "Rua Ataufo Alvis". O popup HERE deve sugerir "Rua Ataulfo Alves" na tela!';
    }
  }, 300);
}

let isDark = false;
function toggleTheme() {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  const iframe = document.getElementById('iframeContainer');
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  if (doc && doc.documentElement) {
    doc.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    if (doc.body) {
      doc.body.style.background = isDark ? '#141e2a' : '#f5f8fa';
      doc.body.style.color = isDark ? '#e3edf4' : '#1a2d38';
    }
  }
  document.getElementById('simStatus').textContent =
    `Tema alternado para ${isDark ? 'Escuro (Dark)' : 'Claro (Light)'}. O popup e tokens CSS acompanham automaticamente.`;
}

// Carregar automaticamente para facilitar o teste
window.addEventListener('load', () => {
  setTimeout(loadForm, 500);
});
</script>
</body>
</html>
